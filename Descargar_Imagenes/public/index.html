<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Downloader Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-3xl w-full bg-[#1e293b] rounded-3xl shadow-2xl overflow-hidden border border-slate-700">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight">TCG Master Downloader</h1>
                <p class="text-blue-100 text-sm mt-1 opacity-90">Sincronización Local de Imágenes</p>
            </div>
            <div id="statusBadge" class="px-4 py-1.5 rounded-full text-sm font-bold bg-slate-800 text-slate-300 border border-slate-600 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-slate-400"></span> PAUSADO
            </div>
        </div>

        <div class="p-8">
            <!-- Stats Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Descargadas</p>
                    <p class="text-2xl font-black text-white" id="valDownloaded">0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Total TCG</p>
                    <p class="text-2xl font-black text-slate-300" id="valTotal">0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Tamaño Estimado</p>
                    <p class="text-2xl font-black text-emerald-400" id="valSize">0.00 GB</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Errores</p>
                    <p class="text-2xl font-black text-red-400" id="valErrors">0</p>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="mb-8">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-sm font-bold text-slate-300">Progreso General</span>
                    <span class="text-3xl font-black text-blue-400" id="valPercentage">0.00%</span>
                </div>
                <div class="w-full h-6 bg-slate-800 rounded-full overflow-hidden border border-slate-700 p-1">
                    <div id="progressBar" class="h-full bg-gradient-to-r from-blue-500 to-indigo-500 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </div>

            <!-- Current Image & Controls -->
            <div class="flex flex-col md:flex-row gap-8 items-center bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50">
                <div class="w-48 h-64 bg-slate-900 rounded-xl border-2 border-slate-700 overflow-hidden flex items-center justify-center flex-shrink-0 relative">
                    <img id="currentImg" src="" alt="Carta Actual" class="w-full h-full object-contain hidden" />
                    <span id="noImg" class="text-slate-600 font-bold text-sm">Esperando...</span>
                </div>
                <div class="flex-1 w-full flex flex-col justify-center">
                    <p class="text-slate-400 text-sm font-bold uppercase tracking-wider mb-2">Descargando actualmente:</p>
                    <p class="text-xl font-bold text-white mb-6 line-clamp-2" id="valCardName">Ninguna</p>
                    
                    <div class="flex gap-4">
                        <button id="btnStart" onclick="toggleDownload(true)" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-black py-4 rounded-xl transition-all shadow-lg shadow-emerald-500/20 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                            INICIAR DESCARGA
                        </button>
                        <button id="btnStop" onclick="toggleDownload(false)" class="flex-1 bg-rose-500 hover:bg-rose-400 text-white font-black py-4 rounded-xl transition-all shadow-lg shadow-rose-500/20 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            PAUSAR
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isDownloading = false;

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                isDownloading = data.isDownloading;
                
                document.getElementById('valDownloaded').innerText = data.downloadedImages.toLocaleString();
                document.getElementById('valTotal').innerText = data.totalProducts.toLocaleString();
                document.getElementById('valSize').innerText = data.estimatedGb + ' GB';
                document.getElementById('valErrors').innerText = data.errorCount;
                document.getElementById('valPercentage').innerText = data.percentage + '%';
                document.getElementById('progressBar').style.width = data.percentage + '%';
                
                if (data.currentImage) {
                    document.getElementById('currentImg').src = data.currentImage;
                    document.getElementById('currentImg').classList.remove('hidden');
                    document.getElementById('noImg').classList.add('hidden');
                    document.getElementById('valCardName').innerText = data.currentProductName;
                }

                // Update UI state
                const badge = document.getElementById('statusBadge');
                if (isDownloading) {
                    badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> DESCARGANDO';
                    badge.className = 'px-4 py-1.5 rounded-full text-sm font-bold bg-emerald-900/50 text-emerald-300 border border-emerald-700/50 flex items-center gap-2';
                    document.getElementById('btnStart').disabled = true;
                    document.getElementById('btnStop').disabled = false;
                } else {
                    badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-slate-400"></span> PAUSADO';
                    badge.className = 'px-4 py-1.5 rounded-full text-sm font-bold bg-slate-800 text-slate-300 border border-slate-600 flex items-center gap-2';
                    document.getElementById('btnStart').disabled = false;
                    document.getElementById('btnStop').disabled = true;
                }

            } catch (err) {
                console.error(err);
            }
        }

        async function toggleDownload(start) {
            try {
                await fetch(start ? '/api/start' : '/api/stop', { method: 'POST' });
                fetchStatus();
            } catch (err) {
                console.error(err);
            }
        }

        // Poll every 2 seconds
        setInterval(fetchStatus, 2000);
        fetchStatus();
    </script>
</body>
</html>
