<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flores Amarillas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #fde68a 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
        }

        .flower-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        .petal {
            position: absolute;
            background: radial-gradient(circle at 50% 100%, #fbbf24 0%, #f59e0b 100%);
            border-radius: 50% 50% 0 50%;
            opacity: 0.8;
        }

        @keyframes fall {
            0% { top: -10%; transform: rotate(0deg); }
            100% { top: 110%; transform: rotate(360deg); }
        }

        @keyframes sway {
            0% { margin-left: 0px; }
            100% { margin-left: 50px; }
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5), 0 0 20px rgba(245, 158, 11, 0.3);
            animation: pulse-glow 2s infinite alternate;
        }

        @keyframes pulse-glow {
            from { text-shadow: 0 0 10px rgba(245, 158, 11, 0.5), 0 0 20px rgba(245, 158, 11, 0.3); }
            to { text-shadow: 0 0 15px rgba(245, 158, 11, 0.8), 0 0 30px rgba(245, 158, 11, 0.5); }
        }

        .center-flower {
            font-size: 130px;
            animation: bounce-rotate 4s infinite ease-in-out alternate;
            filter: drop-shadow(0 15px 20px rgba(245, 158, 11, 0.4));
            z-index: 20;
            position: relative;
        }

        @keyframes bounce-rotate {
            0% { transform: translateY(0) rotate(-10deg) scale(1); }
            100% { transform: translateY(-20px) rotate(10deg) scale(1.1); }
        }
        
        .main-content {
            z-index: 30;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center relative">

    <div class="flower-container" id="petals-layer"></div>

    <div class="main-content flex flex-col items-center justify-center p-6 text-center w-full max-w-sm mx-auto h-full">
        
        <h1 class="text-4xl font-extrabold text-amber-600 mb-2 glow-text drop-shadow-sm">¡Feliz 21 de Septiembre!</h1>
        <p class="text-xl font-medium text-amber-700 mb-8 tracking-wide">Para mi mejor amiga</p>

        <div class="center-flower mb-8">🌻</div>

        <div class="bg-white/40 backdrop-blur-md border border-white/50 p-6 rounded-3xl shadow-2xl relative">
            <div class="absolute -top-3 -right-3 text-3xl rotate-12">✨</div>
            <p class="text-lg text-amber-900 font-bold leading-relaxed mb-4">
                Dicen que quien te regala flores amarillas te quiere para toda la vida.
            </p>
            <p class="text-amber-800 font-semibold">
                Gracias por tu amistad incondicional y por hacer mis días más brillantes. 💛
            </p>
        </div>

    </div>

    <script>
        const container = document.getElementById('petals-layer');
        const petalCount = 45;

        for (let i = 0; i < petalCount; i++) {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const size = Math.random() * 15 + 10;
            const left = Math.random() * 100;
            const durationFall = Math.random() * 5 + 6;
            const delayFall = Math.random() * 8;
            const durationSway = Math.random() * 2 + 2;
            
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.left = `${left}%`;
            petal.style.top = `-10%`;
            petal.style.animation = `fall ${durationFall}s ${delayFall}s linear infinite, sway ${durationSway}s ease-in-out infinite alternate`;
            
            container.appendChild(petal);
        }
    </script>
</body>
</html>
