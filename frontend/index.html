    <!-- Splash inicial: se ve antes de que cargue el JavaScript; React lo reemplaza al montar (mismo diseño que AppSplash.jsx) -->
    <style>
      .app-splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#1a2b4b}
      .app-splash .boot-mark{position:relative;display:flex;align-items:center;justify-content:center;width:8rem;height:8rem;isolation:isolate;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.16),transparent 70%);box-shadow:inset 0 0 0 1px rgba(147,197,253,.1)}
      .app-splash img{height:5rem;width:5rem;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.25));animation:boot-pulse 2s ease-in-out infinite}
      .app-splash .boot-ring{position:absolute;inset:0;box-sizing:border-box;padding:2px;border-radius:50%;background:conic-gradient(from 0deg,transparent 10%,#1e40af 45%,#60a5fa 70%,#facc15 94%,transparent 100%);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;animation:boot-spin 1s linear infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @keyframes boot-pulse{50%{opacity:.85}}
      @media (prefers-reduced-motion:reduce){.app-splash img,.app-splash .boot-ring{animation:none}}
    </style>
    <div id="root"><div id="boot-splash" class="app-splash" role="status" aria-label="Cargando Carpetazo"><span class="boot-mark" aria-hidden="true"><img src="/images/logos/logo_completo.webp" alt="" /><span class="boot-ring"></span></span></div></div>
