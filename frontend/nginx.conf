server {
    listen 80;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    # Security Headers (Global)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; connect-src 'self' https://carpetazo.cl https://api.carpetazo.cl https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data: blob: https://pub-1ba0fdf5c93c4412abbc2b234780b3c6.r2.dev https://*.pokemontcg.io https://*.tcgcsv.com https://tcgcsv.com https://lh3.googleusercontent.com https://firebasestorage.googleapis.com https://www.gstatic.com https://www.google.com https://tcgplayer-cdn.tcgplayer.com https://assets.tcgdex.net https://api.carpetazo.cl https://*.alphacoders.com https://www.transparenttextures.com; media-src 'self' blob: https://pub-1ba0fdf5c93c4412abbc2b234780b3c6.r2.dev; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://carpetazo-f17e0.firebaseapp.com;" always;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de texto (JS, CSS, JSON de datos, SVG)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml text/xml;

    # Archivos con huella en el nombre (Vite): no cambian nunca, el navegador los guarda un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Imágenes y datos públicos (los nombres no cambian aunque se reemplacen): un día en el navegador
    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2)$ {
        expires 1d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~* ^/(magic-meta|yugioh-meta|onepiece-families|riftbound-tags|empty-groups-tcgcsv)\.json$ {
        expires 1d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Do not cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # Redefine security headers because add_header does not inherit if defined in location block
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; connect-src 'self' https://carpetazo.cl https://api.carpetazo.cl https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data: blob: https://pub-1ba0fdf5c93c4412abbc2b234780b3c6.r2.dev https://*.pokemontcg.io https://*.tcgcsv.com https://tcgcsv.com https://lh3.googleusercontent.com https://firebasestorage.googleapis.com https://www.gstatic.com https://www.google.com https://tcgplayer-cdn.tcgplayer.com https://assets.tcgdex.net https://api.carpetazo.cl https://*.alphacoders.com https://www.transparenttextures.com; media-src 'self' blob: https://pub-1ba0fdf5c93c4412abbc2b234780b3c6.r2.dev; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://carpetazo-f17e0.firebaseapp.com;" always;
    }

    # Enlace de una carpeta compartido (/c/<id>): los programas de mensajería reciben la página con la miniatura de la carpeta
    # (la arma el servidor de la API); las personas reciben la aplicación de siempre
    location ~ "^/c/(?<folder_id>[0-9a-fA-F-]{36})/?$" {
        if ($http_user_agent ~* "(whatsapp|facebookexternalhit|facebot|telegrambot|twitterbot|discordbot|slackbot|linkedinbot|skypeuripreview|meta-externalagent|meta-webindexer)") { rewrite ^ /__og/$folder_id last; }
        if ($http_user_agent ~* "(googlebot|bingbot|duckduckbot|yandexbot|applebot|baiduspider|petalbot)") { rewrite ^ /__seo/folder/$folder_id last; }
        try_files /index.html =404;
    }
    location ~ "^/__seo/folder/(?<seo_folder>[0-9a-fA-F-]{36})$" {
        internal;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass https://api.carpetazo.cl/api/seo/folder/$seo_folder;
        proxy_ssl_server_name on;
        proxy_set_header Host api.carpetazo.cl;
        # La API cuenta estos pedidos por la IP del visitante (no la del servidor) solo si la clave coincide con PREVIEW_PROXY_SECRET
        proxy_set_header X-Preview-Proxy "PEGA_AQUI_TU_PREVIEW_PROXY_SECRET";
        proxy_set_header X-Visitor-Ip $http_x_real_ip;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 400 404 429 500 502 503 504 = @app;
    }
    location ~ "^/__og/(?<og_id>[0-9a-fA-F-]{36})$" {
        internal;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass https://api.carpetazo.cl/api/og/folder/$og_id;
        proxy_ssl_server_name on;
        proxy_set_header Host api.carpetazo.cl;
        # La API cuenta estos pedidos por la IP del visitante (no la del servidor) solo si la clave coincide con PREVIEW_PROXY_SECRET
        proxy_set_header X-Preview-Proxy "PEGA_AQUI_TU_PREVIEW_PROXY_SECRET";
        proxy_set_header X-Visitor-Ip $http_x_real_ip;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 400 404 429 500 502 503 504 = @app;
    }
    # Buscadores (Google, Bing…) y programas de mensajería reciben, para cartas y vendedores, una página con el contenido ya escrito (la arma la API);
    # las personas reciben la aplicación de siempre. Si la API no responde o no existe la página, se entrega la aplicación.
    location ~ "^/carta/(?<seo_card_id>[0-9a-fA-F-]{36})/?$" {
        if ($http_user_agent ~* "(googlebot|bingbot|duckduckbot|yandexbot|applebot|baiduspider|petalbot|whatsapp|facebookexternalhit|facebot|telegrambot|twitterbot|discordbot|slackbot|linkedinbot|skypeuripreview|meta-externalagent|meta-webindexer)") { rewrite ^ /__seo/card/$seo_card_id last; }
        try_files /index.html =404;
    }
    location ~ "^/__seo/card/(?<seo_card>[0-9a-fA-F-]{36})$" {
        internal;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass https://api.carpetazo.cl/api/seo/card/$seo_card;
        proxy_ssl_server_name on;
        proxy_set_header Host api.carpetazo.cl;
        # La API cuenta estos pedidos por la IP del visitante (no la del servidor) solo si la clave coincide con PREVIEW_PROXY_SECRET
        proxy_set_header X-Preview-Proxy "PEGA_AQUI_TU_PREVIEW_PROXY_SECRET";
        proxy_set_header X-Visitor-Ip $http_x_real_ip;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 400 404 429 500 502 503 504 = @app;
    }
    # Carta del catálogo (/catalogo/<id>/<nombre>): los buscadores y programas de mensajería reciben la página armada por la API; las personas, la aplicación
    location ~ "^/catalogo/(?<seo_catalog_id>[0-9]{1,10})(/[A-Za-z0-9-]*)?/?$" {
        if ($http_user_agent ~* "(googlebot|bingbot|duckduckbot|yandexbot|applebot|baiduspider|petalbot|whatsapp|facebookexternalhit|facebot|telegrambot|twitterbot|discordbot|slackbot|linkedinbot|skypeuripreview|meta-externalagent|meta-webindexer)") { rewrite ^ /__seo/catalog/$seo_catalog_id last; }
        try_files /index.html =404;
    }
    location ~ "^/__seo/catalog/(?<seo_catalog>[0-9]{1,10})$" {
        internal;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_ssl_server_name on;
        proxy_set_header Host api.carpetazo.cl;
        # La API cuenta estos pedidos por la IP del visitante (no la del servidor) solo si la clave coincide con PREVIEW_PROXY_SECRET
        proxy_set_header X-Preview-Proxy "PEGA_AQUI_TU_PREVIEW_PROXY_SECRET";
        proxy_set_header X-Visitor-Ip $http_x_real_ip;
        proxy_pass https://api.carpetazo.cl/api/seo/catalog/$seo_catalog;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 400 404 429 500 502 503 504 = @app;
    }
    # Debe ir antes que la de vendedores: "sitemap-catalogo-1.xml" también cabe en el patrón de un nombre de usuario
    location ~ "^/sitemap-catalogo-(?<sitemap_n>[1-9][0-9]{0,2})\.xml$" {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_ssl_server_name on;
        proxy_set_header Host api.carpetazo.cl;
        # La API cuenta estos pedidos por la IP del visitante (no la del servidor) solo si la clave coincide con PREVIEW_PROXY_SECRET
        proxy_set_header X-Preview-Proxy "PEGA_AQUI_TU_PREVIEW_PROXY_SECRET";
        proxy_set_header X-Visitor-Ip $http_x_real_ip;
        proxy_pass https://api.carpetazo.cl/api/seo/sitemap-catalogo/$sitemap_n.xml;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location ~ "^/(?<seo_seller_name>[A-Za-z0-9_.-]{3,30})/?$" {
        if ($http_user_agent ~* "(googlebot|bingbot|duckduckbot|yandexbot|applebot|baiduspider|petalbot|whatsapp|facebookexternalhit|facebot|telegrambot|twitterbot|discordbot|slackbot|linkedinbot|skypeuripreview|meta-externalagent|meta-webindexer)") { rewrite ^ /__seo/seller/$seo_seller_name last; }
        try_files $uri $uri/ /index.html;
    }
    location ~ "^/__seo/seller/(?<seo_seller>[A-Za-z0-9_.-]{3,30})$" {
        internal;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass https://api.carpetazo.cl/api/seo/seller/$seo_seller;
        proxy_ssl_server_name on;
        proxy_set_header Host api.carpetazo.cl;
        # La API cuenta estos pedidos por la IP del visitante (no la del servidor) solo si la clave coincide con PREVIEW_PROXY_SECRET
        proxy_set_header X-Preview-Proxy "PEGA_AQUI_TU_PREVIEW_PROXY_SECRET";
        proxy_set_header X-Visitor-Ip $http_x_real_ip;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 400 404 429 500 502 503 504 = @app;
    }

    # Sitemaps armados por la API: el índice (/sitemap.xml), las páginas de Carpetazo y las cartas del catálogo en archivos de hasta 40.000 direcciones.
    # Si la API no responde, se entrega el archivo fijo.
    location = /sitemap.xml {
        set $sitemap_upstream https://api.carpetazo.cl/api/seo/sitemap-index.xml;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_ssl_server_name on;
        proxy_set_header Host api.carpetazo.cl;
        # La API cuenta estos pedidos por la IP del visitante (no la del servidor) solo si la clave coincide con PREVIEW_PROXY_SECRET
        proxy_set_header X-Preview-Proxy "PEGA_AQUI_TU_PREVIEW_PROXY_SECRET";
        proxy_set_header X-Visitor-Ip $http_x_real_ip;
        proxy_pass $sitemap_upstream;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_intercept_errors on;
        error_page 400 404 429 500 502 503 504 = @static_sitemap;
    }
    location = /sitemap-main.xml {
        set $sitemap_upstream https://api.carpetazo.cl/api/seo/sitemap.xml;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_ssl_server_name on;
        proxy_set_header Host api.carpetazo.cl;
        # La API cuenta estos pedidos por la IP del visitante (no la del servidor) solo si la clave coincide con PREVIEW_PROXY_SECRET
        proxy_set_header X-Preview-Proxy "PEGA_AQUI_TU_PREVIEW_PROXY_SECRET";
        proxy_set_header X-Visitor-Ip $http_x_real_ip;
        proxy_pass $sitemap_upstream;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_intercept_errors on;
        error_page 400 404 429 500 502 503 504 = @static_sitemap;
    }
    location @static_sitemap {
        try_files /sitemap.xml =404;
    }
    location @app {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
