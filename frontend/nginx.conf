server {
    listen 80;
    server_name _;
    server_tokens off;

    # Security Headers (Global)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://www.gstatic.com; connect-src 'self' https://carpetazo.cl https://api.carpetazo.cl https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data: https://pub-1ba0fdf5c93c4412abbc2b234780b3c6.r2.dev https://*.pokemontcg.io https://*.tcgcsv.com https://tcgcsv.com https://lh3.googleusercontent.com https://firebasestorage.googleapis.com https://www.gstatic.com https://www.google.com https://tcgplayer-cdn.tcgplayer.com https://api.carpetazo.cl https://*.alphacoders.com https://www.transparenttextures.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://carpetazo-f17e0.firebaseapp.com;" always;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de texto (JS, CSS, JSON de datos, SVG)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Archivos con huella en el nombre (Vite): no cambian nunca, el navegador los guarda un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Imágenes y datos públicos (los nombres no cambian aunque se reemplacen): un día en el navegador
    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2)$ {
        expires 1d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~* ^/(magic-meta|yugioh-meta|onepiece-families|riftbound-tags|empty-groups-tcgcsv)\.json$ {
        expires 1d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Do not cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # Redefine security headers because add_header does not inherit if defined in location block
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://www.gstatic.com; connect-src 'self' https://carpetazo.cl https://api.carpetazo.cl https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data: https://pub-1ba0fdf5c93c4412abbc2b234780b3c6.r2.dev https://*.pokemontcg.io https://*.tcgcsv.com https://tcgcsv.com https://lh3.googleusercontent.com https://firebasestorage.googleapis.com https://www.gstatic.com https://www.google.com https://tcgplayer-cdn.tcgplayer.com https://api.carpetazo.cl https://*.alphacoders.com https://www.transparenttextures.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://carpetazo-f17e0.firebaseapp.com;" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
