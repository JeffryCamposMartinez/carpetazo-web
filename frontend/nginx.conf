server {
    listen 80;
    server_name _;
    server_tokens off;

    # Security Headers (Global)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://www.gstatic.com; connect-src 'self' https://carpetazo.cl https://api.carpetazo.cl http://192.168.1.15:8000 https://identitytoolkit.googleapis.com https://securetoken.googleapis.com wss://*.firebaseio.com; img-src 'self' data: https://*.pokemontcg.io https://*.tcgcsv.com https://tcgcsv.com https://lh3.googleusercontent.com https://firebasestorage.googleapis.com https://www.gstatic.com https://tcgplayer-cdn.tcgplayer.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://carpetazo-f17e0.firebaseapp.com;" always;

    root /usr/share/nginx/html;
    index index.html;

    # Do not cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # Redefine security headers because add_header does not inherit if defined in location block
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://www.gstatic.com; connect-src 'self' https://carpetazo.cl https://api.carpetazo.cl http://192.168.1.15:8000 https://identitytoolkit.googleapis.com https://securetoken.googleapis.com wss://*.firebaseio.com; img-src 'self' data: https://*.pokemontcg.io https://*.tcgcsv.com https://tcgcsv.com https://lh3.googleusercontent.com https://firebasestorage.googleapis.com https://www.gstatic.com https://tcgplayer-cdn.tcgplayer.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://carpetazo-f17e0.firebaseapp.com;" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
