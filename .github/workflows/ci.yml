name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: carpetazo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Validate backend syntax
        run: node --check server.js
        working-directory: backend

      - name: Validate Prisma schema
        run: npx prisma validate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/carpetazo

  deploy-vps:
    name: Deploy to VPS
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            test -n "${{ secrets.VPS_PROJECT_PATH }}" || (echo "Missing VPS_PROJECT_PATH secret" && exit 1)
            test -n "${{ secrets.VPS_RESTART_COMMAND }}" || (echo "Missing VPS_RESTART_COMMAND secret" && exit 1)
            cd "${{ secrets.VPS_PROJECT_PATH }}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            cd backend
            touch .env
            upsert_env() {
              key="$1"
              value="$2"
              if [ -z "$value" ]; then
                echo "Missing $key secret" >&2
                exit 1
              fi
              escaped_value=$(printf '%s' "$value" | sed 's/[\/&]/\\&/g')
              if grep -q "^${key}=" .env; then
                sed -i "s/^${key}=.*/${key}=${escaped_value}/" .env
              else
                printf '\n%s=%s\n' "$key" "$value" >> .env
              fi
            }
            upsert_env "R2_ACCOUNT_ID" "${{ secrets.R2_ACCOUNT_ID }}"
            upsert_env "R2_ACCESS_KEY_ID" "${{ secrets.R2_ACCESS_KEY_ID }}"
            upsert_env "R2_SECRET_ACCESS_KEY" "${{ secrets.R2_SECRET_ACCESS_KEY }}"
            upsert_env "R2_BUCKET_NAME" "${{ secrets.R2_BUCKET_NAME }}"
            upsert_env "R2_PUBLIC_URL" "${{ secrets.R2_PUBLIC_URL }}"
            npm ci
            GIT_COMMIT="${{ github.sha }}" npm run build
            cd ../frontend
            npm ci
            VITE_API_URL="${{ secrets.VITE_API_URL }}" npm run build
            ${{ secrets.VPS_RESTART_COMMAND }}
